{"s": "assets/4ad9a8b926f08c1f097a31ae4cf8dd3a.png", "h": 1121.4, "c": 265.4}, {"s": "assets/0cc1a14f83fad4336ebeb448676f964d.png", "h": 1128.0, "c": 258.6}]}, "back": {"stand": {"s": "assets/32e09211688d35172768e382854986cf.png", "h": 1128.0, "c": 253.1}, "walk": [{"s": "assets/d33d2ad05d02171ac9a192adb7163252.png", "h": 1128.0, "c": 251.5}, {"s": "assets/32e09211688d35172768e382854986cf.png", "h": 1128.0, "c": 253.1}, {"s": "assets/0bd31edd74e9cfa25f1e33de121d5192.png", "h": 1128.0, "c": 252.4}, {"s": "assets/6875f1b45b43e54e4869470e6c41c47b.png", "h": 1128.0, "c": 253.1}]}, "left": {"stand": {"s": "assets/b054848fdd2a82e0a649a545f3c0f9d6.png", "h": 1128.0, "c": 236.9}, "walk": [{"s": "assets/c251803abb92bdf39664cc5e7290cd74.png", "h": 1134.8, "c": 326.1}, {"s": "assets/e2ca45e01ed5143118f48084ed273d8d.png", "h": 1128.0, "c": 240.2}, {"s": "assets/70939662670bc05080cf789ae23bbd5d.png", "h": 1138.2, "c": 330.7}, {"s": "assets/b054848fdd2a82e0a649a545f3c0f9d6.png", "h": 1128.0, "c": 236.9}]}, "right": {"stand": {"s": "assets/cd794851e9581e2f14691a4c1ca07ba7.png", "h": 1128.0, "c": 265.4}, "walk": [{"s": "assets/5747fe0ed756c9deb26e23a920d7921e.png", "h": 1131.4, "c": 266.9}, {"s": "assets/d053bd789a31af9bfe58f521f9c4622e.png", "h": 1131.4, "c": 263.0}, {"s": "assets/34ebc4808df81876ae82bbe3f2ea2b2b.png", "h": 1138.3, "c": 285.8}, {"s": "assets/cd794851e9581e2f14691a4c1ca07ba7.png", "h": 1128.0, "c": 265.4}]}}};
    const g = isMale ? 'male' : 'female';
    const f = this.state.facing;
    const y = this.state.y;
    const set = FR[g][f];
    const fr = this.state.walking ? set.walk[this.state.frame % set.walk.length] : set.stand;
    const disp = 300 - y * 0.9;
    const k = disp / 1130;
    const hold = (dir) => () => { this.usedPointer = true; this.press(dir); };
    const tap = (dir) => () => {
      if (this.usedPointer) { this.usedPointer = false; return; }
      if (this.state.facing !== dir) this.turn(dir); else this.step(dir);
    };
    const SP = { male: { front: FR.male.front.stand.s }, female: { front: FR.female.front.stand.s } };
    return {
      accent,
      fr: fr,
      imgH: Math.round(fr.h * k) + 'px',
      imgLeft: Math.round(130 - fr.c * k) + 'px',
      spriteAlt: (isMale ? '기본 남자 캐릭터 ' : '기본 여자 캐릭터 ') + { front: '앞모습', left: '왼쪽 옆모습', right: '오른쪽 옆모습', back: '뒷모습' }[f],
      posLeft: 'calc(45% + ' + this.state.x + 'px)',
      posBottom: (24 + y) + 'px',
      motion: this.state.walking ? '' : 'yg-idle',
      holdUp: hold('back'), holdDown: hold('front'), holdLeft: hold('left'), holdRight: hold('right'),

      femaleBg: !isMale ? '#e6f3f0' : '#ffffff', femaleBorder: !isMale ? accent : '#e4ddce',
      start: (e) => {
        const el = document.getElementById('nick'); const nick = ((el && el.value) || '').trim().slice(0, 10);
        if (window.YGA && YGA.on) {
          if (e && e.preventDefault) e.preventDefault();
          if (!YGA.user) { if (window.ygShowAuth) window.ygShowAuth(); return; }
          YG.save('me', { gender: this.state.gender, nick: YGA.data.nick });
          YGA.save({ gender: this.state.gender }, true).then(() => { location.href = 'game.html'; });
          return;
        }
        YG.save('me', { gender: this.state.gender, nick: nick });
      },
      pickMale: () => this.setState({ gender: 'male' }),
      pickFemale: () => this.setState({ gender: 'female' })
    };

}

fitFrame(document.getElementById('yg-frame'));
mountDC(Component, document.getElementById('yg-root'));
(function(){ const me = YG.load('me', null); const s = YG.load('state', null);
  const nick = (me && me.nick) || (s && s.prof && s.prof.nick) || '';
  const el = document.getElementById('nick'); if (el && nick) el.value = nick;
  if (me && me.gender) window.__dc.setState({ gender: me.gender }); })();
(function () {
  if (!window.YGA || !YGA.on) return;
  const $ = (id) => document.getElementById(id);
  const box = $('yg-auth');
  let mode = 'login';
  const setMode = (m) => {
    mode = m;
    $('yg-tab-login').setAttribute('aria-selected', m === 'login' ? 'true' : 'false');
    $('yg-tab-join').setAttribute('aria-selected', m === 'join' ? 'true' : 'false');
    $('yg-a-pw2-wrap').style.display = m === 'join' ? 'flex' : 'none';
    $('yg-a-birth-wrap').style.display = m === 'join' ? 'flex' : 'none';
    $('yg-a-pw').setAttribute('autocomplete', m === 'join' ? 'new-password' : 'current-password');
    $('yg-a-go').textContent = m === 'join' ? '가입하고 시작하기' : '로그인';
    $('yg-a-err').textContent = '';
  };
  $('yg-tab-login').onclick = () => setMode('login');
  $('yg-tab-join').onclick = () => setMode('join');
  ['yg-a-y', 'yg-a-m', 'yg-a-d'].forEach((id, i, arr) => {
    $(id).addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      if (e.target.value.length >= +e.target.maxLength && arr[i + 1]) $(arr[i + 1]).focus();
    });
  });

  const loggedIn = (acc) => {
    box.style.display = 'none';
    $('yg-out').style.display = 'block';
    const el = $('nick');
    if (el) { el.value = acc.data.nick; el.readOnly = true; el.style.background = '#f4efe5'; }
    if (window.__dc && acc.data.gender) window.__dc.setState({ gender: acc.data.gender });
  };
  window.ygShowAuth = () => { box.style.display = 'flex'; };

  $('yg-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('yg-a-err'), go = $('yg-a-go');
    err.textContent = '';
    const nick = $('yg-a-nick').value.trim(), pw = $('yg-a-pw').value;
    try {
      go.disabled = true;
      let acc;
      if (mode === 'join') {
        if (pw !== $('yg-a-pw2').value) throw new Error('비밀번호가 서로 달라요');
        const y = $('yg-a-y').value, m = $('yg-a-m').value.padStart(2, '0'), d = $('yg-a-d').value.padStart(2, '0');
        acc = await YGA.signup(nick, pw, y + '-' + m + '-' + d);
      } else {
        acc = await YGA.login(nick, pw);
      }
      if (acc.data.banned) { await YGA.logout(); throw new Error('신고 누적으로 이용이 정지된 계정이에요'); }
      loggedIn(acc);
    } catch (ex) {
      err.textContent = ex.message || '잠시 후 다시 시도해 주세요';
    } finally { go.disabled = false; }
  });

  $('yg-out').onclick = async () => {
    await YGA.logout();
    try { localStorage.removeItem('yg_me'); } catch (e) {}
    const el = $('nick'); if (el) { el.readOnly = false; el.value = ''; el.style.background = '#fff'; }
    $('yg-out').style.display = 'none';
    setMode('login');
    box.style.display = 'flex';
  };

  YGA.ready().then((acc) => {
    if (acc && !acc.data.banned) loggedIn(acc);
    else { if (acc) YGA.logout(); box.style.display = 'flex'; }
  });
})();
