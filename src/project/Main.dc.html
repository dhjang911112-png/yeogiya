<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>여기야 캐릭터 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fbf7ef}
a{color:#23756b}a:hover{color:#1a5a52}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
@keyframes yg-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.yg-idle{animation:yg-idle 2.4s ease-in-out infinite}
@keyframes yg-walk{0%,100%{transform:translateY(0)}25%{transform:translateY(-8px)}50%{transform:translateY(0)}75%{transform:translateY(-8px)}}
.yg-walk{animation:yg-walk 0.45s ease-in-out 1}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fbf7ef; font-family: 'Noto Sans KR', sans-serif; color: #2b2a26; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 60px; padding: 8px 12px 0; display: flex; align-items: center; justify-content: center">
    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 22px">캐릭터 선택</h1>
  </header>

  <section style="margin: 4px 16px 0; height: 400px; border-radius: 28px; background: #a9d6f7; position: relative; overflow: hidden">
    <svg viewBox="0 0 358 400" width="358" height="400" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <rect x="0" y="0" width="358" height="400" style="fill: #a9d6f7"></rect>
      <ellipse cx="62" cy="70" rx="30" ry="11" style="fill: #ffffff"></ellipse>
      <ellipse cx="84" cy="62" rx="20" ry="11" style="fill: #ffffff"></ellipse>
      <ellipse cx="292" cy="120" rx="24" ry="9" style="fill: #ffffff; opacity: 0.85"></ellipse>
      <ellipse cx="60" cy="400" rx="200" ry="62" style="fill: #b9e19e"></ellipse>
      <ellipse cx="320" cy="408" rx="180" ry="70" style="fill: #a7d68b"></ellipse>
    </svg>

    <div style="position: absolute; left: {{posLeft}}; bottom: {{posBottom}}; margin-left: -130px; width: 260px; height: 330px; transition: left 0.14s linear, bottom 0.14s linear">
      <div style="position: absolute; left: 65px; bottom: 0; width: 130px; height: 13px; margin-bottom: -6px; border-radius: 50%; background: rgba(40,90,140,0.22)"></div>
      <div class="{{motion}}" style="position: absolute; left: 0; bottom: 0; width: 260px; height: 330px">
        <img src="{{fr.s}}" alt="{{spriteAlt}}" style="position: absolute; bottom: 0; left: {{imgLeft}}; height: {{imgH}}; width: auto; max-width: none; display: block">
      </div>
    </div>

    <div style="position: absolute; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; width: 141px">
      <span></span>
      <button onClick="{{tapUp}}" onPointerDown="{{holdUp}}" onPointerUp="{{release}}" onPointerLeave="{{release}}" onPointerCancel="{{release}}" aria-label="위로 이동" style="height: 44px; border: none; border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; background: rgba(255,255,255,0.88); display: flex; align-items: center; justify-content: center; color: #2b2a26">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <span></span>
      <button onClick="{{tapLeft}}" onPointerDown="{{holdLeft}}" onPointerUp="{{release}}" onPointerLeave="{{release}}" onPointerCancel="{{release}}" aria-label="왼쪽으로 이동" style="height: 44px; border: none; border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; background: rgba(255,255,255,0.88); display: flex; align-items: center; justify-content: center; color: #2b2a26">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <button onClick="{{tapDown}}" onPointerDown="{{holdDown}}" onPointerUp="{{release}}" onPointerLeave="{{release}}" onPointerCancel="{{release}}" aria-label="아래로 이동" style="height: 44px; border: none; border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; background: rgba(255,255,255,0.88); display: flex; align-items: center; justify-content: center; color: #2b2a26">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button onClick="{{tapRight}}" onPointerDown="{{holdRight}}" onPointerUp="{{release}}" onPointerLeave="{{release}}" onPointerCancel="{{release}}" aria-label="오른쪽으로 이동" style="height: 44px; border: none; border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; background: rgba(255,255,255,0.88); display: flex; align-items: center; justify-content: center; color: #2b2a26">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </section>

  <div style="margin: 18px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button onClick="{{pickMale}}" aria-pressed="{{isMaleStr}}" style="height: 76px; border-radius: 18px; background: {{maleBg}}; border: 2px solid {{maleBorder}}; display: flex; align-items: center; justify-content: center; gap: 10px; overflow: hidden; font-family: 'Jua', sans-serif; font-size: 20px; color: #2b2a26">
      <span style="width: 52px; height: 60px; overflow: hidden; display: block; position: relative"><img src="{{maleImg}}" alt="" style="position: absolute; left: 50%; top: 0; width: 64px; margin-left: -32px; display: block"></span>
      남자
    </button>
    <button onClick="{{pickFemale}}" aria-pressed="{{isFemaleStr}}" style="height: 76px; border-radius: 18px; background: {{femaleBg}}; border: 2px solid {{femaleBorder}}; display: flex; align-items: center; justify-content: center; gap: 10px; overflow: hidden; font-family: 'Jua', sans-serif; font-size: 20px; color: #2b2a26">
      <span style="width: 52px; height: 60px; overflow: hidden; display: block; position: relative"><img src="{{femaleImg}}" alt="" style="position: absolute; left: 50%; top: 0; width: 62px; margin-left: -31px; display: block"></span>
      여자
    </button>
  </div>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 6px">
    <label for="nick" style="font-size: 13px; font-weight: 700; color: #5d5a52">닉네임</label>
    <input id="nick" type="text" maxlength="10" placeholder="2~10자" style="height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 2px solid #e4ddce; background: #ffffff; font-size: 16px; color: #2b2a26">
  </div>

  <p style="margin: 14px 16px 0; font-size: 13px; color: #5d5a52; line-height: 1.6; text-align: center">모두 같은 기본 모습으로 시작해요.<br>노동 활동으로 머니를 벌어 옷과 아이템을 사서 꾸며보세요.</p>

  <div style="margin-top: auto; padding: 12px 16px 28px">
    <a href="Game.dc.html" style="width: 100%; height: 56px; border-radius: 18px; background: {{accent}}; font-family: 'Jua', sans-serif; font-size: 20px; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none">여기야 시작하기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#23756b","options":["#23756b","#2f5d9e","#b5532f","#3d3a35"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { gender: 'male', facing: 'front', x: 0, y: 0, walking: false, frame: 0 };
    this.iv = null; this.to = null; this.pressed = false; this.usedPointer = false;
  }

  componentWillUnmount() { this.stopTimers(); }

  stopTimers() {
    if (this.iv) { clearInterval(this.iv); this.iv = null; }
    if (this.to) { clearTimeout(this.to); this.to = null; }
  }

  turn(facing) {
    if (this.state.facing !== facing) this.setState({ facing: facing });
  }

  walkLoop(facing) {
    const V = { front: [0, -5], back: [0, 5], left: [-9, 0], right: [9, 0] }[facing];
    if (this.iv) clearInterval(this.iv);
    this.setState({ facing: facing, walking: true, frame: 0 });
    this.iv = setInterval(() => {
      const x = Math.max(-75, Math.min(45, this.state.x + V[0]));
      const y = Math.max(0, Math.min(60, this.state.y + V[1]));
      this.setState({ x: x, y: y, frame: this.state.frame + 1 });
    }, 140);
  }

  press(facing) {
    this.pressed = true;
    this.stopTimers();
    this.setState({ facing: facing, walking: false, frame: 0 });
    this.to = setTimeout(() => { this.to = null; if (this.pressed) this.walkLoop(facing); }, 200);
  }

  lift() {
    if (!this.pressed) return;
    this.pressed = false;
    this.stopTimers();
    if (this.state.walking) this.setState({ walking: false, frame: 0 });
  }

  step(facing) {
    this.stopTimers();
    this.walkLoop(facing);
    this.to = setTimeout(() => { this.stopTimers(); this.setState({ walking: false, frame: 0 }); }, 560);
  }

  renderVals() {
    const accent = this.props.accent ?? '#23756b';
    const isMale = this.state.gender === 'male';
    const FR = {"female": {"front": {"stand": {"s": "/_blob/4210bfc2057d06282024c8de4464efe4", "h": 1130, "c": 225.3}, "walk": [{"s": "/_blob/40c198de8a6ef198dcbc384e2484645b", "h": 1129, "c": 238.7}, {"s": "/_blob/4210bfc2057d06282024c8de4464efe4", "h": 1130, "c": 225.3}, {"s": "/_blob/b48d253edec9db5767966acfaf34654b", "h": 1152, "c": 233.3}, {"s": "/_blob/4210bfc2057d06282024c8de4464efe4", "h": 1130, "c": 225.3}]}, "back": {"stand": {"s": "/_blob/748504c270c5bb2bcf919af0c01fefb9", "h": 1130, "c": 217.2}, "walk": [{"s": "/_blob/578a7718a010dbbe53107b6770cf07ee", "h": 1115, "c": 218.6}, {"s": "/_blob/748504c270c5bb2bcf919af0c01fefb9", "h": 1130, "c": 217.2}, {"s": "/_blob/51961fa83ca6b95e6fb5e7a25d6c5183", "h": 1101, "c": 213.0}, {"s": "/_blob/748504c270c5bb2bcf919af0c01fefb9", "h": 1130, "c": 217.2}]}, "left": {"stand": {"s": "/_blob/863d1a90e2b344432fbc3dbbf7016906", "h": 1130, "c": 205.2}, "walk": [{"s": "/_blob/b900a6ab75b31c3ddd8291ee720496e5", "h": 1092, "c": 274.7}, {"s": "/_blob/863d1a90e2b344432fbc3dbbf7016906", "h": 1130, "c": 205.2}, {"s": "/_blob/e525b1531ed757783dd46746a87e135a", "h": 1092, "c": 280.7}, {"s": "/_blob/863d1a90e2b344432fbc3dbbf7016906", "h": 1130, "c": 205.2}]}, "right": {"stand": {"s": "/_blob/e2bc07159a3883ed072ed086e325673c", "h": 1130, "c": 214.9}, "walk": [{"s": "/_blob/4a3bd46580d64a9f0b65e634e9650c50", "h": 1082, "c": 260.2}, {"s": "/_blob/5d8a2efd0e1f6e4c3c45c036ab9dd660", "h": 1101, "c": 235.9}, {"s": "/_blob/64caf3bae8736f88cb82ac520bbfda30", "h": 1111, "c": 275.4}, {"s": "/_blob/5d8a2efd0e1f6e4c3c45c036ab9dd660", "h": 1101, "c": 235.9}]}}, "male": {"front": {"stand": {"s": "/_blob/470f35cce6d7dfd1142963840e013c18", "h": 1130, "c": 235.2}, "walk": [{"s": "/_blob/685f3ea2b298a310185796a2db0acf15", "h": 1149, "c": 249.2}, {"s": "/_blob/470f35cce6d7dfd1142963840e013c18", "h": 1130, "c": 235.2}, {"s": "/_blob/7f6e8883a88e5e8e9db0b00f34e914d5", "h": 1142, "c": 237.5}, {"s": "/_blob/470f35cce6d7dfd1142963840e013c18", "h": 1130, "c": 235.2}]}, "back": {"stand": {"s": "/_blob/5d08a44994be9caad05622bb4e3bff31", "h": 1130, "c": 230.8}, "walk": [{"s": "/_blob/f7723606381f2097fb0e5da06d633f53", "h": 1122, "c": 227.7}, {"s": "/_blob/5d08a44994be9caad05622bb4e3bff31", "h": 1130, "c": 230.8}]}, "left": {"stand": {"s": "/_blob/4fb58fc70346eb54502a5bc4761c12fa", "h": 1130, "c": 239.0}, "walk": [{"s": "/_blob/d60f92b2e46776070c56ba0047a9e50b", "h": 1112, "c": 266.9}, {"s": "/_blob/a24ac1f468426d29059441fb1ff58d0f", "h": 1110, "c": 245.3}, {"s": "/_blob/1d11384822fd5c525b28c5d49102e956", "h": 1101, "c": 270.7}, {"s": "/_blob/a24ac1f468426d29059441fb1ff58d0f", "h": 1110, "c": 245.3}]}, "right": {"stand": {"s": "/_blob/efaed9547ca7654cef8d544e0eb8543c", "h": 1130, "c": 236.2}, "walk": [{"s": "/_blob/b24f062e140460f58e9330960acd60d6", "h": 1133, "c": 291.9}, {"s": "/_blob/42b73bb13d774281cc903a4e9cbf712b", "h": 1158, "c": 246.2}, {"s": "/_blob/759cbb3ea6c5df35af6ed0711e0fcc5b", "h": 1119, "c": 271.2}, {"s": "/_blob/42b73bb13d774281cc903a4e9cbf712b", "h": 1158, "c": 246.2}]}}};
    const g = isMale ? 'male' : 'female';
    const f = this.state.facing;
    const y = this.state.y;
    const set = FR[g][f];
    const fr = this.state.walking ? set.walk[this.state.frame % set.walk.length] : set.stand;
    const disp = 300 - y * 0.9;
    const k = disp / 1130;
    const hold = (dir) => () => { this.usedPointer = true; this.press(dir); };
    const tap = (dir) => () => {
      if (this.usedPointer) { this.usedPointer = false; return; }
      if (this.state.facing !== dir) this.turn(dir); else this.step(dir);
    };
    const SP = { male: { front: FR.male.front.stand.s }, female: { front: FR.female.front.stand.s } };
    return {
      accent,
      fr: fr,
      imgH: Math.round(fr.h * k) + 'px',
      imgLeft: Math.round(130 - fr.c * k) + 'px',
      spriteAlt: (isMale ? '기본 남자 캐릭터 ' : '기본 여자 캐릭터 ') + { front: '앞모습', left: '왼쪽 옆모습', right: '오른쪽 옆모습', back: '뒷모습' }[f],
      posLeft: 'calc(45% + ' + this.state.x + 'px)',
      posBottom: (24 + y) + 'px',
      motion: this.state.walking ? '' : 'yg-idle',
      holdUp: hold('back'), holdDown: hold('front'), holdLeft: hold('left'), holdRight: hold('right'),
      tapUp: tap('back'), tapDown: tap('front'), tapLeft: tap('left'), tapRight: tap('right'),
      release: () => this.lift(),
      maleImg: SP.male.front, femaleImg: SP.female.front,
      isMaleStr: isMale ? 'true' : 'false', isFemaleStr: isMale ? 'false' : 'true',
      maleBg: isMale ? '#e6f3f0' : '#ffffff', maleBorder: isMale ? accent : '#e4ddce',
      femaleBg: !isMale ? '#e6f3f0' : '#ffffff', femaleBorder: !isMale ? accent : '#e4ddce',
      pickMale: () => this.setState({ gender: 'male' }),
      pickFemale: () => this.setState({ gender: 'female' })
    };
  }
}
</script>
</body>
</html>
