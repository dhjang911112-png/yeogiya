<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>여기야 아바타 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#fbf7ef; --card:#ffffff; --line:#ece5d6; --fg:#2b2a26; --sub:#6b665c; --accent:#23756b; --warn:#b5532f; --floor:#efe6d2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1f1d1a; --card:#2b2925; --line:#3d3a35; --fg:#f1ece2; --sub:#b8b1a4; --floor:#2f2b25; } }
:root[data-theme="dark"] { --bg:#1f1d1a; --card:#2b2925; --line:#3d3a35; --fg:#f1ece2; --sub:#b8b1a4; --floor:#2f2b25; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:'Noto Sans KR',system-ui,sans-serif; overscroll-behavior:none; }
.wrap { max-width:560px; margin:0 auto; padding:14px 16px 24px; display:flex; flex-direction:column; gap:12px; }
h1 { font-family:'Jua',sans-serif; font-size:24px; margin:0; }
.sub { font-size:12px; color:var(--sub); line-height:1.6; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
button.chip { height:38px; padding:0 14px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--fg); font:700 13px 'Noto Sans KR',sans-serif; cursor:pointer; }
button.chip[aria-pressed="true"] { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--card)); }
.stage { position:relative; height:min(62vh,520px); border-radius:18px; overflow:hidden; background:var(--floor); border:1px solid var(--line); touch-action:none; }
.stage canvas { position:absolute; inset:0; width:100%; height:100%; }
.hud { position:absolute; left:10px; top:10px; right:10px; display:flex; justify-content:space-between; gap:8px; pointer-events:none; font-size:11px; font-weight:700; }
.pill { padding:4px 9px; border-radius:999px; background:rgba(43,42,38,.72); color:#fff; }
.pill.warn { background:var(--warn); }
.stick { position:absolute; left:18px; bottom:18px; width:112px; height:112px; border-radius:50%; background:rgba(43,42,38,.12); border:2px solid rgba(43,42,38,.18); touch-action:none; }
.knob { position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:var(--accent); box-shadow:0 2px 8px rgba(0,0,0,.25); }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
.slots { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.slot { border:2px dashed var(--line); border-radius:12px; padding:8px; font-size:12px; min-height:58px; display:flex; flex-direction:column; gap:3px; }
.slot b { font-size:12px; }
.slot span { color:var(--warn); font-size:11px; }
.miss { font-size:12px; color:var(--warn); line-height:1.6; margin:0; padding-left:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>아바타 실험실 · 정면 시범</h1>
  <div class="sub">공식 기본 바디(정면)를 파츠로 나눈 리그예요. 그림이 없는 방향은 정면 그림으로 대신 보이며 "이미지 필요"로 표시돼요. 측면 걷기(디딤발 고정 IK)는 그림이 오기 전까지 회색 디버그 마네킹으로만 확인할 수 있어요(게임에는 안 나옴). 이동: 방향키/WASD 또는 왼쪽 아래 조이스틱.</div>
  <div class="row" role="group" aria-label="성별">
    <button class="chip" id="bm" aria-pressed="true">남자 기본 바디</button>
    <button class="chip" id="bf" aria-pressed="false">여자 기본 바디</button>
    <button class="chip" id="bd" aria-pressed="false">관절 표시</button>
    <button class="chip" id="bq" aria-pressed="false">디버그 마네킹(측면 검증)</button>
    <button class="chip" id="bw" aria-pressed="false">자동 걷기</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><span class="pill" id="st">대기</span><span class="pill" id="fps">-</span></div>
    <div class="stick" id="stick" aria-label="이동 조이스틱"><div class="knob" id="knob"></div></div>
  </div>
  <div class="card">
    <b>장착 칸 (그림이 들어오면 자동 연결)</b>
    <div class="slots" id="slots"></div>
  </div>
  <div class="card">
    <b>지금 없는 이미지</b>
    <ul class="miss" id="miss"></ul>
  </div>
</div>
<script src="lib/avatar.js"></script>
<script>
(function () {
  const AV = window.YGAvatar;
  const cv = document.getElementById('cv'), stage = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const look = { body: 'male_base', dir: 'front', equip: { hair: '', top: 'tee_white', bottom: 'jeans_blue', shoes: 'sneakers_white', outer: '', accessory: '' } };
  const anim = new AV.Animator();
  const me = { x: 0, y: 0, vx: 0, vy: 0, dir: 'front' };
  const keys = new Set(); let stick = { x: 0, y: 0 }; let auto = false; let debug = false;
  const prints = [];
  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = stage.clientWidth; H = stage.clientHeight; cv.width = W * DPR; cv.height = H * DPR; if (!me.x) { me.x = W / 2; me.y = H * 0.45; } }
  window.addEventListener('resize', resize); resize();
  const KEYS = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
  addEventListener('keydown', (e) => { const k = KEYS[e.code]; if (k) { keys.add(k); e.preventDefault(); } });
  addEventListener('keyup', (e) => { const k = KEYS[e.code]; if (k) keys.delete(k); });
  addEventListener('blur', () => keys.clear());
  // joystick
  const sEl = document.getElementById('stick'), kEl = document.getElementById('knob');
  let sid = null;
  const setStick = (e) => { const r = sEl.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const L = Math.hypot(dx, dy), M = r.width / 2 - 10; if (L > M) { dx *= M / L; dy *= M / L; } kEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; stick = { x: dx / M, y: dy / M }; };
  sEl.addEventListener('pointerdown', (e) => { sid = e.pointerId; sEl.setPointerCapture(sid); setStick(e); });
  sEl.addEventListener('pointermove', (e) => { if (e.pointerId === sid) setStick(e); });
  const endStick = () => { sid = null; stick = { x: 0, y: 0 }; kEl.style.transform = ''; };
  sEl.addEventListener('pointerup', endStick); sEl.addEventListener('pointercancel', endStick);
  const btn = (id, f) => document.getElementById(id).addEventListener('click', f);
  btn('bm', () => { look.body = 'male_base'; document.getElementById('bm').setAttribute('aria-pressed', 'true'); document.getElementById('bf').setAttribute('aria-pressed', 'false'); refresh(); });
  btn('bf', () => { look.body = 'female_base'; document.getElementById('bf').setAttribute('aria-pressed', 'true'); document.getElementById('bm').setAttribute('aria-pressed', 'false'); refresh(); });
  btn('bd', () => { debug = !debug; document.getElementById('bd').setAttribute('aria-pressed', String(debug)); });
  btn('bw', () => { auto = !auto; document.getElementById('bw').setAttribute('aria-pressed', String(auto)); });
  let mq = false, savedBody = 'male_base';
  btn('bq', () => { mq = !mq; document.getElementById('bq').setAttribute('aria-pressed', String(mq)); if (mq) { AV.makeMannequin(); savedBody = look.body; look.body = 'mannequin'; } else look.body = savedBody; prints.length = 0; refresh(); });
  const SLOTN = { hair: '헤어', top: '상의', bottom: '하의', shoes: '신발', outer: '아우터', accessory: '액세서리' };
  function refresh() {
    const m = AV.manifest; if (!m) return;
    document.getElementById('slots').innerHTML = Object.keys(SLOTN).map((s) => { const id = look.equip[s]; const ok = id && m.items[id]; return '<div class="slot"><b>' + SLOTN[s] + '</b>' + (id ? (ok ? id : id + '<span>그림 없음</span>') : '<span style="color:var(--sub)">비어 있음</span>') + '</div>'; }).join('');
    const b = m.bodies[look.body];
    document.getElementById('miss').innerHTML = b.missing.map((x) => '<li>' + x + '</li>').join('') + '<li>테스트 의상(티셔츠 2, 바지 2, 신발 2, 헤어 2) 파츠 그림</li>';
  }
  window.__lab = { me: me, anim: anim, look: look, prints: prints, keys: keys, setStick: (x, y) => { stick = { x: x, y: y }; } };
  let last = performance.now(), fN = 0, fT = last, worst = 0;
  const SPEED = 128; // 화면 px/s (게임과 동일)
  function frame(t) {
    requestAnimationFrame(frame);
    const raw = t - last; last = t; const dt = Math.min(0.05, raw / 1000);
    fN++; worst = Math.max(worst, raw); if (t - fT > 500) { document.getElementById('fps').textContent = Math.round(fN * 1000 / (t - fT)) + 'fps · 최악 ' + Math.round(worst) + 'ms'; fN = 0; fT = t; worst = 0; }
    let ix = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0) + stick.x, iy = (keys.has('d') ? 1 : 0) - (keys.has('u') ? 1 : 0) + stick.y;
    if (auto) { iy = 0; ix = me.autoX || 1; if (me.x > W - 60) me.autoX = -1; if (me.x < 60) me.autoX = 1; ix = me.autoX || 1; }
    const L = Math.hypot(ix, iy); if (L > 1) { ix /= L; iy /= L; }
    const tv = L > 0.12 ? 1 : 0;
    const acc = (tv ? 1000 : 1500) * dt;
    const tx = ix * SPEED, ty = iy * SPEED;
    me.vx += Math.max(-acc, Math.min(acc, tx - me.vx)); me.vy += Math.max(-acc, Math.min(acc, ty - me.vy));
    const ox = me.x, oy = me.y;
    me.x = Math.max(40, Math.min(W - 40, me.x + me.vx * dt)); me.y = Math.max(Math.min(H * 0.34, 190) + 10, Math.min(H - 10, me.y + me.vy * dt));
    const moved = Math.hypot(me.x - ox, me.y - oy);
    const ax = Math.abs(me.vx), ay = Math.abs(me.vy);
    if (moved > 0.01) { if (ax > ay * 1.2) me.dir = me.vx > 0 ? 'right' : 'left'; else if (ay > ax * 1.2) me.dir = me.vy > 0 ? 'front' : 'back'; }
    const S = Math.min(H * 0.34, 190) / 1000;
    const a = anim.update(dt, moved, S, moved > 0.02, me.dir);
    look.dir = me.dir;
    // draw
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120,100,60,.12)'; ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // footprints (stance foot positions) to check sliding
    ctx.fillStyle = 'rgba(181,83,47,.35)'; prints.forEach((p) => { ctx.beginPath(); ctx.ellipse(p.x, p.y, 7, 3, 0, 0, Math.PI * 2); ctx.fill(); });
    // shadow
    ctx.fillStyle = 'rgba(60,50,20,.18)'; ctx.beginPath(); ctx.ellipse(me.x, me.y, 40 * S * 5, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(me.x - 256 * S, me.y - 1000 * S);
    const res = AV.draw(ctx, look, a, { scale: S, debug: debug });
    ctx.restore();
    // 디딤발 화면 위치 기록(미끄럼 측정) — 디딤 구간 가운데에서 찍음
    if (a.walk > 0.9) {
      const side = res.dir === 'left' || res.dir === 'right';
      const stanceA = (a.phase % 1) < 0.5;
      const which = side ? (stanceA ? 'Near' : 'Far') : (stanceA ? 'L' : 'R');
      const fp = AV.footPos(look, a, which);
      if (fp) {
        const fx = me.x + (fp[0] - 256) * S, fy = me.y + (fp[1] - 1000) * S;
        window.__lab.foot = { leg: which, x: fx, y: fy, phase: a.phase, dir: res.dir };
        const lastP = prints[prints.length - 1];
        if (!lastP || lastP.leg !== which) prints.push({ leg: which, x: fx, y: fy }); if (prints.length > 30) prints.shift();
      }
    }
    const stEl = document.getElementById('st');
    const warn = res.missing.filter((m) => m.indexOf('방향') >= 0);
    stEl.textContent = (a.walk > 0.5 ? '걷기' : '대기') + ' · ' + { front: '정면', back: '뒷면', left: '왼쪽', right: '오른쪽' }[me.dir] + (warn.length ? ' · 이미지 필요' : '');
    stEl.className = 'pill' + (warn.length ? ' warn' : '');
  }
  AV.load('assets/avatar/manifest.json').then(() => { refresh(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
